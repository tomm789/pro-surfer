name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  headless:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run smoke
      - name: Screenshots for review
        run: |
          node tools/screenshot.mjs --scene game --flow ride --auto 1 --t 8 --out artifacts/ride.png
          node tools/screenshot.mjs --scene game --flow menu --t 1 --out artifacts/menu.png
          node tools/screenshot.mjs --scene ride --beach reefpass --ft 10 --auto 1 --cam wide --t 12 --out artifacts/reefpass-wide.png
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: artifacts/*.png
